; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-waveshare-psram]
board = ESP-General
board_build.partitions = custom_8Mb.csv
board_build.arduino.memory_type = qio_opi  ; NEEDED FOR 8MB PSRAM (N16R8)
board_build.psram = enabled
build_src_filter =${env.build_src_filter} +<../boards/esp32s3_waveshare35>

monitor_port = COM4
monitor_speed = 115200


build_flags =
	${env.build_flags}
	-Iboards/esp32s3_waveshare35
	-DWAVESHARE_35B
	-DUSER_SETUP_LOADED=1
	-DBAD_RX=-1
	-DBAD_TX=-1

	-DCORE_DEBUG_LEVEL=1


lib_deps =
	${env.lib_deps}
	https://github.com/iAmDevBhatt/es8311.git
	https://github.com/iAmDevBhatt/esp_lcd_touch_axs15231b.git
	https://github.com/moononournation/Arduino_GFX.git
	https://github.com/RobTillaart/TCA9554.git
    ;lvgl/lvgl@^9.5.0
	https://github.com/lewisxhe/SensorLib.git
	https://github.com/mathertel/OneButton.git
	;https://github.com/schreibfaul1/ESP32-audioI2S.git
	https://github.com/lewisxhe/XPowersLib.git
